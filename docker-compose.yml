services:
  db:
    image: postgres:16-alpine
    container_name: runna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: runna
      POSTGRES_PASSWORD: runna_secret
      POSTGRES_DB: runna_db
    volumes:
      - runna_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runna -d runna_db"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: runna-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://runna:runna_secret@db:5432/runna_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: runna-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
      - "5173:80"

volumes:
  runna_pgdata:
